name: Build iOS-style EN-RU bottom-row Morphe patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Gboard-patches source
        uses: actions/checkout@v4
        with:
          repository: jasonwu1994/Gboard-patches
          ref: main
          path: gboard-patches

      - name: Verify patch file
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::error::Patch file not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Apply EN/RU patch
        working-directory: gboard-patches
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Morphe bundle
        working-directory: gboard-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid generatePatchesList

      - name: Upload Morphe bundle
        uses: actions/upload-artifact@v4
        with:
          name: gboard-ios-eng-rus-bottom-row-morphe
          path: "gboard-patches/**/*.mpp"
          if-no-files-found: error
          retention-days: 7
