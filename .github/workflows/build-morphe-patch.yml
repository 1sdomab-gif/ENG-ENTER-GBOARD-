name: Build iOS-style EN-RU bottom-row Morphe patch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Gboard-iOS-ENG-RUS-Bottom-Row-Morphe.patch"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Gboard-patches source
        uses: actions/checkout@v4
        with:
          repository: jasonwu1994/Gboard-patches
          ref: main
          path: gboard-patches

      - name: Verify patch file exists
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::error::Patch file not found: $PATCH"
            echo "Files in repository root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Apply the independent EN/RU patch
        working-directory: gboard-patches
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build Morphe bundle
        working-directory: gboard-patches
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid generatePatchesList

      - name: Upload Morphe patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: gboard-ios-eng-rus-bottom-row-morphe
          path: |
            gboard-patches/**/*.mpp
          if-no-files-found: error
          retention-days: 7
