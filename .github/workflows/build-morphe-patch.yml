name: Build iOS-style EN-RU bottom-row Morphe patch

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Gboard-patches source
        uses: actions/checkout@v4
        with:
          repository: jasonwu1994/Gboard-patches
          ref: 976b7495da1cc94a30ae5007a62ab6e6d28fcfba
          path: gboard-patches
          fetch-depth: 1

      - name: Apply the independent EN/RU patch
        working-directory: gboard-patches
        run: |
          git apply --check ../Gboard-iOS-ENG-RUS-Bottom-Row-Morphe.patch
          git apply ../Gboard-iOS-ENG-RUS-Bottom-Row-Morphe.patch

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test and build Morphe bundle
        working-directory: gboard-patches
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:test :patches:buildAndroid generatePatchesList --no-daemon

      - name: Upload Morphe patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: gboard-ios-eng-rus-bottom-row-morphe
          path: gboard-patches/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
