name: Build iOS-style EN-RU bottom-row Morphe patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Gboard-patches source
        uses: actions/checkout@v4
        with:
          repository: jasonwu1994/Gboard-patches
          ref: 976b7495da1cc94a30ae5007a62ab6e6d28fcfba
          path: gboard-patches

      - name: Verify patch and normalize Morphe registry URL
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$GITHUB_WORKSPACE/gboard-patches/settings.gradle.kts"
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          test -f "$SETTINGS" || { echo "::error::settings.gradle.kts not found"; exit 1; }
          test -f "$PATCH" || { echo "::error::Patch file not found"; exit 1; }
          sed -i 's#https://maven.pkg.github.com/MorpheApp/registry#https://maven.pkg.github.com/morpheapp/registry#g' "$SETTINGS"
          grep -F 'https://maven.pkg.github.com/morpheapp/registry' "$SETTINGS"

      - name: Check access to Morphe Gradle plugin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::MORPHE_GITHUB_TOKEN is empty or unavailable to this workflow."
            exit 1
          fi
          URL="https://maven.pkg.github.com/morpheapp/registry/app/morphe/patches/app.morphe.patches.gradle.plugin/1.3.3/app.morphe.patches.gradle.plugin-1.3.3.pom"
          CODE=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user "$GITHUB_ACTOR:$GITHUB_TOKEN" "$URL")
          echo "Morphe plugin POM HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Cannot read the Morphe plugin POM. HTTP $CODE. Do not post the token in logs or chat."
            exit 1
          fi

      - name: Apply EN/RU patch
        working-directory: gboard-patches
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Morphe bundle
        working-directory: gboard-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid generatePatchesList --stacktrace

      - name: Upload Morphe bundle
        uses: actions/upload-artifact@v4
        with:
          name: gboard-ios-eng-rus-bottom-row-morphe
          path: "gboard-patches/**/*.mpp"
          if-no-files-found: error
          retention-days: 7
