name: Build iOS-style EN-RU bottom-row Morphe patch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout pinned Gboard-patches source
        uses: actions/checkout@v4
        with:
          repository: jasonwu1994/Gboard-patches
          ref: 976b7495da1cc94a30ae5007a62ab6e6d28fcfba
          path: gboard-patches
          fetch-depth: 1

      - name: Verify patch file
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          test -f "$PATCH" || { echo "::error::Patch file not found: $PATCH"; ls -la "$GITHUB_WORKSPACE"; exit 1; }

      - name: Apply independent EN/RU patch
        working-directory: gboard-patches
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/Gboard-iOS-ENG-RUS-Bottom-Row-Morphe-FIXED-1.patch"
          git apply --check "$PATCH"
          git apply "$PATCH"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Morphe bundle
        working-directory: gboard-patches
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:test :patches:buildAndroid generatePatchesList --no-daemon

      - name: Upload Morphe bundle
        uses: actions/upload-artifact@v4
        with:
          name: gboard-ios-eng-rus-bottom-row-morphe
          path: gboard-patches/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
